[tox]
requires =
    tox-uv>=1.28.1
    tox>=4.30.0
env_list =
    py39
    py310
    py311
    py312
    py313
    py314t
    py315
    py315t
    pytest_earliest
    reportlog
    run_parallel
    swarm
    freethreaded
    coverage-py313
    coverage
    lint
    ty
    mypy-src
    mypy-tests
    mypy-example
    mypy-examples

labels =
    mypy = mypy-src, mypy-tests, mypy-example, mypy-examples
    static-analysis = lint, mypy-src, mypy-tests, mypy-example, mypy-examples

skip_missing_interpreters = true

[testenv]
commands = pytest {posargs}
description = Run pytest
package = wheel
wheel_build_env = .pkg
uv_seed = true

[testenv:coverage]
deps =
    coverage
base_python = python3.13
commands =
    coverage combine --keep \
        {tox_root}/.tox/coverage-py313 \
        {tox_root}/.tox/run_parallel \
        {tox_root}/.tox/swarm \
        {tox_root}/.tox/freethreaded
    coverage report --fail-under=100 --show-missing
depends =
    coverage-py313
    run_parallel
    swarm
    freethreaded
description = Combine coverage from standard and thread-runner test environments

[testenv:coverage-py313]
deps =
    coverage
    pytest-reportlog
base_python = python3.13
setenv =
    COVERAGE_FILE = {tox_root}/.tox/coverage-py313/.coverage
commands_pre =
    python -c "from pathlib import Path; Path(r'{tox_root}/.tox/coverage-py313').mkdir(parents=True, exist_ok=True)"
    coverage erase
commands =
    coverage run --parallel-mode --source=pytest_check,tests -m pytest
description = Run the standard suite with coverage

[testenv:reportlog]
deps =
    pytest-reportlog
base_python = python3.13
commands =
    pytest tests/test_reportlog.py::test_report_log_does_not_crash
description = Verify reportlog compatibility

[testenv:run_parallel]
deps =
    coverage
    pytest-run-parallel
base_python = python3.13
setenv =
    COVERAGE_FILE = {tox_root}/.tox/run_parallel/.coverage
commands_pre =
    python -c "from pathlib import Path; Path(r'{tox_root}/.tox/run_parallel').mkdir(parents=True, exist_ok=True)"
    coverage erase
commands =
    coverage run --parallel-mode --source=pytest_check,tests -m pytest tests/test_parallel_threads.py
description = Verify check failure isolation under pytest-run-parallel with coverage

[testenv:swarm]
deps =
    coverage
    pytest-swarm
base_python = python3.13
setenv =
    COVERAGE_FILE = {tox_root}/.tox/swarm/.coverage
commands_pre =
    python -c "from pathlib import Path; Path(r'{tox_root}/.tox/swarm').mkdir(parents=True, exist_ok=True)"
    coverage erase
commands =
    coverage run --parallel-mode --source=pytest_check,tests -m pytest tests/test_thread_runner_compat.py::test_check_failures_are_isolated_across_pytest_swarm_items
description = Verify check failure isolation under pytest-swarm with coverage

[testenv:freethreaded]
deps =
    coverage
    pytest-freethreaded
base_python = python3.14t
setenv =
    COVERAGE_FILE = {tox_root}/.tox/freethreaded/.coverage
    PYTEST_ADDOPTS = --threads=1 --iterations=1 --require-gil-disabled
commands_pre =
    python -c "from pathlib import Path; Path(r'{tox_root}/.tox/freethreaded').mkdir(parents=True, exist_ok=True)"
    coverage erase
commands =
    coverage run --parallel-mode --source=pytest_check,tests -m pytest tests/test_thread_runner_compat.py::test_check_failures_are_isolated_across_pytest_freethreaded_workers
description = Verify check failure isolation under pytest-freethreaded with coverage on free-threaded Python

[testenv:pytest_earliest]
deps = pytest==7.0.0
base_python = python3.11
commands = pytest {posargs}
description = Run earliest supported pytest

[testenv:lint]
skip_install = true
deps = ruff<=0.15.0
base_python = python3.14
commands = ruff check src tests examples
description = Run ruff over src, test, examples

[testenv:mypy-{src,tests,example,examples}]
deps =
    mypy
    httpx
    numpy
    # pluggy added type checking support in version 1.3.0
    pluggy>=1.3
base_python = python3.14
commands =
    src: mypy --strict src
    tests: mypy tests
    example: mypy --strict examples/test_example_mypy.py
    examples: mypy --pretty --strict \
        --allow-untyped-defs \
        --disable-error-code=comparison-overlap \
        --disable-error-code=no-untyped-call \
        examples --exclude examples/test_example_mypy_fail.py|examples/test_example_multi_check_raises.py
description = Run mypy for {envname}

[testenv:ty]
deps =
    ty
    httpx
    numpy
    pluggy>=1.3
base_python = python3.14
commands =
    ty check src tests examples
description = Run ty over src, test, examples

[pytest]
addopts =
    --color=yes
    --strict-markers
    --strict-config
    -ra

testpaths = tests
