[tox]
requires =
    tox-uv>=1.28.1
    tox>=4.30.0
env_list =
    py39
    py310
    py311
    py312
    py313
    py314t
    py315
    py315t
    pytest_earliest
    reportlog
    coverage
    lint
    ty
    mypy

skip_missing_interpreters = true

[testenv]
commands = pytest {posargs}
description = Run pytest
package = wheel
wheel_build_env = .pkg
uv_seed = true

[testenv:coverage]
deps =
    coverage
    pytest-reportlog
base_python = python3.13
commands =
    coverage run --source={envsitepackagesdir}/pytest_check,tests -m pytest
    coverage report --fail-under=100 --show-missing
description = Run pytest, with coverage

[testenv:reportlog]
deps =
    pytest-reportlog
base_python = python3.13
commands =
    pytest tests/test_reportlog.py::test_report_log_does_not_crash
description = Verify reportlog compatibility

[testenv:pytest_earliest]
deps = pytest==7.0.0
base_python = python3.11
commands = pytest {posargs}
description = Run earliest supported pytest

[testenv:lint]
skip_install = true
deps = ruff<=0.15.0
base_python = python3.14
commands = ruff check src tests examples
description = Run ruff over src, test, examples

[testenv:mypy]
deps =
    mypy
    httpx
    numpy
    # pluggy added type checking support in version 1.3.0
    pluggy>=1.3
base_python = python3.14
commands =
    # want strict for src so users can use strict if they want
    mypy --strict src

    # don't need strict for internal tests
    mypy tests

    # tests that support --strict
    mypy --strict examples/test_example_mypy.py 

    # considering ways to make sure this fails
    # mypy --strict examples/test_example_mypy_fail.py

    # for most examples, I'd like to not use all type hints to aid in readability
    ; --strict  # mostly strict
    ; --allow-untyped-defs  # don't require "-> None" type hints
    ; --disable-error-code=comparison-overlap # allow assert 1 == 2
    ; --disable-error-code=no-untyped-call # allow calls to helper functions with no type hints
    ; exclude examples that are intentionally type-invalid to test runtime behavior
    mypy --pretty --strict \
        --allow-untyped-defs \
        --disable-error-code=comparison-overlap \
        --disable-error-code=no-untyped-call \
        examples --exclude examples/test_example_mypy_fail.py|examples/test_example_multi_check_raises.py
description = Run mypy over src, test, examples

[testenv:ty]
deps =
    ty
    httpx
    numpy
    pluggy>=1.3
base_python = python3.14
commands =
    ty check src tests examples
description = Run ty over src, test, examples

[pytest]
addopts =
    --color=yes
    --strict-markers
    --strict-config
    -ra

testpaths = tests
